name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step: the suite is stdlib-only and hermetic by design.
      - run: python -m unittest discover -s tests -v
      - name: Package installs and the entry point runs
        run: |
          pip install .
          starhistorygithub --version
